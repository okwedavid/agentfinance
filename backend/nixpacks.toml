[variables]
NIXPACKS_PKGS = "openssl_3_x"

[phases.build]
# We are already inside the /backend folder, so the path is local
cmds = ["npm ci", "npx prisma generate --schema=./prisma/schema.prisma"]

[start]
# Ensure the schema is applied to the database before booting, then start.
# `prisma db push` is idempotent and non-destructive.
cmd = "sh -c 'npx prisma db push --schema=./prisma/schema.prisma && node src/index.js'"