[variables]
NIXPACKS_PKGS = "openssl_3_x"

[phases.build]
# We are already inside the /backend folder, so the path is local
cmds = ["npm ci", "npx prisma generate --schema=./prisma/schema.prisma"]

[start]
# Baseline the existing database (records already-applied migrations via
# `prisma migrate resolve --applied`; never runs DDL or drops data) BEFORE
# `prisma migrate deploy` so a db-push-created database does not trigger
# P3005. Mirrors the `npm start` chain:
#   node prisma/baseline.js && prisma migrate deploy && node src/index.js
cmd = "sh -c 'node prisma/baseline.js && npx prisma migrate deploy --schema=./prisma/schema.prisma && node src/index.js'"
